  <body>
    <center><h2>MAKUACH MINYIEL MACHAR </h2></center>
       <form id="waForm">
  <input type="text" id="name" placeholder="Your Name" required>
  <input type="text" id="phone" placeholder="Your Phone">
  <textarea id="message" placeholder="Your Message" required></textarea><br>
  <button type="submit">SEND WHATSAPP MESSAGE</button>
</form>

<script>
let waFormPocket = document.getElementById('waForm');

waFormPocket.addEventListener('submit', function(e){
  e.preventDefault(); // stop page from reloading

  let name = document.getElementById('name').value;
  let phone = document.getElementById('phone').value;
  let message = document.getElementById('message').value;

  // Build the WhatsApp message
  let finalText = "Name: " + name + "%0A" + "Phone: " + phone + "%0A" + "Message: " + message;
  // %0A means new line in WhatsApp link

  // Your WhatsApp number
  let myNumber = "211920616316";

  // Create WhatsApp link and open
  let waLink = "https://wa.me/" + myNumber + "?text=" + finalText;
  
  window.open(waLink, '_blank');
});
</script>
